  - slug: tolinski
    section: under-30
    template: feature
    title: Brad Tolinski Books
    hosts:
      - scott
    items:
      - item: brad-tolinski-books
        maxQuotes: 1
        collage:
          - ""
          - "2"
          - "3"
          - "4"
          - "5"
    copy:
      headline: "'Rock History' from Scott's Uncle"
      body: "are by the editor-in-chief of *Guitar World* for 25 years (1989–2015), who has written a ton of books. **Real conversations** with guitar legends: *Eruption* (Eddie Van Halen), *Light & Shade* (Jimmy Page), and *Blow by Blow* (Jeff Beck). **An oral history,** *MC5: An Oral Biography of Rock's Most Revolutionary Band.* **The whole story** of the electric guitar in *Play It Loud.* **Under 20 bucks** for most of them, and a lot are on Audible too."

