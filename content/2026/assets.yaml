assets:
  - key: cover-art
    file: cover/cover-art
    label: "Cover: Santa checks his watch, grouse elf with a gift"
    color: "#14204a"
    aspect: "3:4"
    prompt: >-
      An airbrushed 1990s painted illustration: Santa Claus in glasses checking a
      classic Casio-style digital wristwatch, standing beside a cartoon ruffed
      grouse mascot in a green elf hat holding a wrapped gift. Reindeer and snowy
      pines behind, a sleigh stuffed with gadgets (headphones, retro handheld,
      power bank). Glossy, cheerful, saturated, a toy-catalog cover from 1996. No
      text.
  - key: IMG-S1
    file: generated/section-favorites-stockings-on-mantel
    label: six knitted stockings on a 90s mantel, gadgets peeking out
    color: "#C5301F"
    aspect: "4:5"
    prompt: >-
      A cozy 1990s living room fireplace mantel at night: six knitted Christmas
      stockings in different colors hung in a row, each one stuffed with gadgets
      peeking out (a coiled silicone USB-C cable, a small power bank, headphones,
      a beard trimmer, a toothbrush, a Casio-style digital watch). Garland, tiny
      white lights, a brass clock, warm firelight.

      Photographed like a product shot in a 1996 department store Christmas
      catalog: medium-format color film, warm tungsten key light with soft fill,
      slightly oversaturated reds and greens, shallow depth of field, festive
      props (fresh pine boughs, red satin ribbon, glass ornaments, wrapped gifts
      in 90s foil paper) on a dark wood tabletop. Subtle film grain and a faint
      printed-halftone texture, as if scanned from a glossy catalog page. Leave
      clean negative space for copy. No text, no captions, no watermarks; keep
      only the product's own branding exactly as in the reference image.
